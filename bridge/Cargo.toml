[package]
name = "cardinal-native-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
search-cache = { path = "../engine/search-cache" }
search-cancel = { path = "../engine/search-cancel" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
cardinal-sdk = { path = "../engine/cardinal-sdk" }
fswalk = { path = "../engine/fswalk" }
crossbeam-channel = "0.5"
libc = "0.2"
rayon = "1.9"

[dev-dependencies]
tempfile = "3"
